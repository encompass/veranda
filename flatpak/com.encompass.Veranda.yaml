# Flatpak manifest for Veranda.
#
# Build (from the repo root):
#   flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
#   flatpak-builder --user --install --force-clean build flatpak/com.encompass.Veranda.yaml
#   flatpak run com.encompass.Veranda
#
# The python-deps module fetches from PyPI during its build (build-arg
# --share=network). That is fine for local/CI builds. For a Flathub submission,
# replace it with a pinned module generated by `flatpak-pip-generator
# streamdeck Pillow evdev` (Flathub forbids network access at build time).
#
# Device access: --device=all grants the sandbox /dev access, which the app
# needs both for the Stream Deck (USB/hidraw) and for /dev/uinput (the Hotkey
# and Type Text actions). The host still needs the udev uaccess rule from
# data/60-veranda-streamdeck.rules for non-root device access.
app-id: com.encompass.Veranda
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: veranda

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=session-bus
  # Stream Deck (USB/hidraw) and /dev/uinput for Wayland-safe key injection.
  - --device=all
  # Own our well-known name (control interface + search provider).
  - --own-name=com.encompass.Veranda
  # Tray icon (StatusNotifierItem) and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Lock-screen sync.
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.freedesktop.ScreenSaver
  # Now Playing widget (MPRIS).
  - --talk-name=org.mpris.MediaPlayer2.*
  # Battery widget (UPower lives on the system bus).
  - --system-talk-name=org.freedesktop.UPower
  # Run-in-background portal.
  - --talk-name=org.freedesktop.portal.Background
  # GSettings access (Do Not Disturb toggle, GNOME Shortcut lookup) via dconf.
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  # Read access for images dragged onto keys / icon uploads outside the portal.
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-warn-script-location streamdeck Pillow evdev

  - name: veranda
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/com.encompass.Veranda.desktop
        /app/share/applications/com.encompass.Veranda.desktop
      - install -Dm644 data/com.encompass.Veranda.metainfo.xml
        /app/share/metainfo/com.encompass.Veranda.metainfo.xml
      - install -Dm644 src/veranda/icon.svg
        /app/share/icons/hicolor/scalable/apps/com.encompass.Veranda.svg
      - install -Dm644 data/com.encompass.Veranda.search-provider.ini
        /app/share/gnome-shell/search-providers/com.encompass.Veranda.search-provider.ini
    sources:
      - type: dir
        path: ..
